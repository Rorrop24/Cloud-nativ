# Cluster Kafka de tres brokers con Zookeeper y Kafka-UI.
# KAFKA_HOST_IP llega desde .env (IP privada de la EC2, o localhost en desarrollo).
name: punto-gamer-kafka
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-broker: &broker
  image: confluentinc/cp-kafka:7.9.0
  restart: unless-stopped
  networks: [kafka]
  logging: *logging
  depends_on:
    zookeeper: {condition: service_healthy}
x-broker-environment: &broker-environment
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    restart: unless-stopped
    networks: [kafka]
    logging: *logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      # La imagen no trae nc; bash abre el puerto directamente.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/2181"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  kafka-1:
    <<: *broker
    environment:
      <<: *broker-environment
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${KAFKA_HOST_IP}:9092
    ports: ["9092:9092"]
    volumes: ["kafka-1-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/29092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  kafka-2:
    <<: *broker
    environment:
      <<: *broker-environment
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${KAFKA_HOST_IP}:9093
    ports: ["9093:9093"]
    volumes: ["kafka-2-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/29092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  kafka-3:
    <<: *broker
    environment:
      <<: *broker-environment
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${KAFKA_HOST_IP}:9094
    ports: ["9094:9094"]
    volumes: ["kafka-3-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/29092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    networks: [kafka]
    logging: *logging
    # Solo localhost de la maquina: en AWS se abre con un tunel SSM, nunca a Internet.
    ports: ["127.0.0.1:8095:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: punto-gamer
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xms128m -Xmx384m"
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
networks:
  kafka: {driver: bridge}
volumes:
  zookeeper-data: {}
  zookeeper-log: {}
  kafka-1-data: {}
  kafka-2-data: {}
  kafka-3-data: {}
