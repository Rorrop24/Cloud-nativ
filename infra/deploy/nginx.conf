server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/bff/ { proxy_pass http://bff:8084; }
    location /bff/ { proxy_pass http://bff:8084; }
    location /v2/ { proxy_pass http://backend:8082; }
    location /api/ { proxy_pass http://backend:8082; }
    location /images/ { proxy_pass http://backend:8082; }
    location = /health { proxy_pass http://backend:8082/health; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
