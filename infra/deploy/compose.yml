name: punto-gamer-application
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  backend:
    build: ./Backend
    restart: unless-stopped
    mem_limit: 1200m
    env_file: /etc/punto-gamer/backend.env
    volumes:
      - ./data:/app/data
    networks: [application]
    logging: *logging
  bff:
    build: ./BffJava
    restart: unless-stopped
    mem_limit: 768m
    env_file: /etc/punto-gamer/bff.env
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    logging: *logging
  proxy:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    mem_limit: 128m
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [application]
    logging: *logging
networks:
  application:
    driver: bridge
