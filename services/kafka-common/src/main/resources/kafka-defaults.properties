# Unica fuente de la configuracion Kafka del proyecto. La leen los servicios Java
# (StreamingProperties), Terraform (kafka.tf crea los topics en la EC2) y la
# documentacion. Cada linea app.kafka.topics.<clave> declara un topic, y sus
# lineas retention.<clave> y cleanup.<clave> definen como se conserva.
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
app.kafka.partitions=3
app.kafka.replication-factor=3
# Con 3 replicas y min.insync=2 un broker puede caer sin perder escrituras (acks=all).
app.kafka.min-insync-replicas=2

# Ventas confirmadas, clave = boleta. 7 dias: la analitica se reconstruye releyendolas.
app.kafka.topics.ventas=ventas.eventos
app.kafka.retention.ventas=604800000
app.kafka.cleanup.ventas=delete

# Un evento por producto vendido, clave = producto (orden por producto).
app.kafka.topics.items=ventas.items
app.kafka.retention.items=604800000
app.kafka.cleanup.items=delete

# Mensajes rechazados tras los reintentos. 14 dias para investigar la causa.
app.kafka.topics.ventas-dlt=ventas.eventos.DLT
app.kafka.retention.ventas-dlt=1209600000
app.kafka.cleanup.ventas-dlt=delete

app.kafka.topics.items-dlt=ventas.items.DLT
app.kafka.retention.items-dlt=1209600000
app.kafka.cleanup.items-dlt=delete

# Resumen agregado, siempre con la misma clave: compactado conserva el ultimo valor.
app.kafka.topics.resumen=analitica.resumen
app.kafka.retention.resumen=604800000
app.kafka.cleanup.resumen=compact

# Mensajes de prueba manuales. Un dia basta.
app.kafka.topics.pruebas=pruebas.eventos
app.kafka.retention.pruebas=86400000
app.kafka.cleanup.pruebas=delete
