# Unica fuente de nombres de topics: la leen los servicios Java, Terraform (kafka.tf)
# y el script local init-topics.sh. Cada linea app.kafka.topics.* crea un topic.
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
app.kafka.partitions=3
app.kafka.replication-factor=3
app.kafka.topics.ventas=ventas.eventos
app.kafka.topics.items=ventas.items
app.kafka.topics.ventas-dlt=ventas.eventos.DLT
app.kafka.topics.items-dlt=ventas.items.DLT
app.kafka.topics.resumen=analitica.resumen
app.kafka.topics.pruebas=pruebas.eventos
