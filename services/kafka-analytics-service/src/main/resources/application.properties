spring.application.name=kafka-analytics-service
server.port=8090

# --- Cliente Kafka -----------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=analytics

# Consumidores: el texto se convierte a DTO (VentaRegistradaEvent, ProductoVendidoEvent)
# y se valida en SalesStreamConsumer; asi un JSON invalido llega al manejador de errores.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Grupo por defecto; cada @KafkaListener declara el suyo (analitica-ventas, -productos, -dlt).
spring.kafka.consumer.group-id=analitica
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.metadata.max.age.ms=30000

# Tres hilos por grupo = uno por particion: el grupo reparte la carga y, si un hilo
# o una instancia cae, sus particiones pasan a los demas.
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# Productor: resumen (DTO) y reenvio de mensajes fallidos al DLT (texto original).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=cl.puntogamer.streaming.EventJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000

# Crea los topics que falten y corrige su retencion y limpieza al arrancar.
spring.kafka.admin.fail-fast=false
spring.kafka.admin.modify-topic-configs=true
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=8000

# --- Analitica y seguridad ----------------------------------------------------
app.analytics.low-stock-threshold=5
app.analytics.snapshot-interval-ms=30000
app.security.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/v2.0}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/discovery/v2.0/keys}
app.security.audience=${AZURE_API_AUDIENCE:ff0f75e1-6d35-40f4-89ae-44a2cfacd4b1}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
