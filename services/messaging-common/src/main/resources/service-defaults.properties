spring.datasource.url=${DB_URL:jdbc:h2:mem:punto_gamer;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:levelup}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:levelup}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.security.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/v2.0}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/discovery/v2.0/keys}
app.security.audience=${AZURE_API_AUDIENCE:ff0f75e1-6d35-40f4-89ae-44a2cfacd4b1}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
app.outbox.enabled=${OUTBOX_ENABLED:true}
