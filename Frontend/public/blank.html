<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Autenticando...</title>
</head>
<body style="background: #121212; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0;">
  <p>Cerrando ventana e iniciando sesión...</p>

  <script>
    (function () {
      // 1. Obtener los parámetros devueltos por Azure (#code=... o ?code=...)
      var hash = window.location.hash || window.location.search;

      // 2. Si la ventana fue abierta por la app principal, enviarle la respuesta
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage(
            {
              type: "MSAL_POPUP_RESPONSE",
              hash: hash,
              url: window.location.href
            },
            window.location.origin
          );
        } catch (e) {
          console.error("Error al notificar a la ventana principal:", e);
        }
      }

      // 3. Cerrar la ventana emergente tras enviar el mensaje
      setTimeout(function () {
        window.close();
      }, 100);
    })();
  </script>
</body>
</html>
