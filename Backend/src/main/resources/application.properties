spring.application.name=TiendaLevelUp
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@tiendalevelup_low?TNS_ADMIN=/home/ubuntu/Wallet_tiendalevelup}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
spring.rabbitmq.username=${RABBITMQ_USERNAME:levelup}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:levelup}
spring.rabbitmq.connection-timeout=5000
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false
app.rabbitmq.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
app.messaging.output-dir=${MESSAGING_OUTPUT_DIR:./data/events}
app.security.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/a5af7e18-9965-418a-9b8a-a0dd9bd96c52/v2.0}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/a5af7e18-9965-418a-9b8a-a0dd9bd96c52/discovery/v2.0/keys}
app.security.audience=${AZURE_API_AUDIENCE:ae706c64-5e56-4573-b311-b2919b52c67a}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://127.0.0.1:4200}
server.forward-headers-strategy=none
springdoc.swagger-ui.path=/swagger-ui.html
