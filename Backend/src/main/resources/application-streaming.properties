# Perfil EP3: se suma a "aws" (SPRING_PROFILES_ACTIVE=aws,streaming).
# Sin este perfil el Backend no crea productores Kafka y se comporta como en EP2.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.producer.client-id=backend-ventas
# Clave = id de boleta o de producto (texto); valor = DTO serializado a JSON.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=cl.puntogamer.streaming.EventJsonSerializer
# Entrega confiable: confirmacion de todas las replicas en sincronia y sin duplicados.
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.compression-type=gzip
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
# No bloquear una compra si Kafka no responde: el envio falla rapido y queda en el log.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
