spring.datasource.url=jdbc:h2:mem:punto-gamer;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
app.security.issuer-uri=https://issuer.test/v2.0
app.security.jwk-set-uri=http://localhost:1/keys
app.security.audience=punto-gamer-api
app.security.allowed-origins=http://localhost:4200,http://localhost:5173
