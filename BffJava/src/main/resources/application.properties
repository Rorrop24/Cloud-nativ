spring.application.name=punto-gamer-bff
server.port=${SERVER_PORT:8084}
app.backend-url=${BACKEND_URL:http://localhost:8082}
app.security.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/a5af7e18-9965-418a-9b8a-a0dd9bd96c52/v2.0}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/a5af7e18-9965-418a-9b8a-a0dd9bd96c52/discovery/v2.0/keys}
app.security.audience=${AZURE_API_AUDIENCE:ae706c64-5e56-4573-b311-b2919b52c67a}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
# Deploy on private EC2 behind API Gateway -> VPC Link -> internal ALB.
# Security groups must restrict 8084 to the ALB and 8082 to this BFF.
server.forward-headers-strategy=none
server.error.include-message=never
