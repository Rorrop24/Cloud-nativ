spring.application.name=punto-gamer-bff
server.port=${SERVER_PORT:8084}
app.backend-url=${BACKEND_URL:http://localhost:8082}
app.security.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/v2.0}
app.security.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/6fb3d735-1c10-4007-b977-7dbea3388386/discovery/v2.0/keys}
app.security.audience=${AZURE_API_AUDIENCE:ff0f75e1-6d35-40f4-89ae-44a2cfacd4b1}
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
# Deploy on private EC2 behind API Gateway -> VPC Link -> internal ALB.
# Security groups must restrict 8084 to the ALB and 8082 to this BFF.
server.forward-headers-strategy=none
server.error.include-message=never

app.rabbit-admin-url=${RABBIT_ADMIN_URL:http://localhost:8088}
